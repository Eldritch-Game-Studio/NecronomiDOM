name: CI/CD

# Code PRs and main: unit/capability checks, Linux native build and real runtime smokes.
# Native/bindings/tooling PRs, v* tags and full manual runs: five native builds and
# fresh installed-final-ZIP qualification on every target. Docs/media: offline content/link checks only.
# Only superseded PR runs are cancelled; tag releases never share a cancellation group.
# LINUX_RUNNER=self-hosted selects [self-hosted,Linux,X64,necronomidom], otherwise ubuntu-24.04.
# Manual partial=true is an explicitly non-release Linux diagnostic (also used by scripts/ci-local.sh).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      partial:
        description: Linux-only diagnostic ZIP (never a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      code: ${{ steps.policy.outputs.code }}
      full: ${{ steps.policy.outputs.full }}
      package: ${{ steps.policy.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify event and complete changed paths
        id: policy
        run: python3 scripts/ci-policy.py

  docs:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation content and offline link targets
        run: |
          python3 scripts/check-docs.py
          python3 scripts/generate-capabilities.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","necronomidom"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        if: vars.LINUX_RUNNER != 'self-hosted'
        with:
          python-version: '3.12'
      - name: Check generated capability reference
        run: |
          python3 scripts/generate-capabilities.py --check
          python3 -m unittest discover -s scripts -p 'test_generate_capabilities.py'
      - run: dotnet test tests/NecronomiDom.Tests -nologo

  native-linux-x64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","necronomidom"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        if: vars.LINUX_RUNNER != 'self-hosted'
        with:
          python-version: '3.12'
      - name: NativeAOT toolchain
        run: command -v clang >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq clang zlib1g-dev)
      - name: Identify pinned SDK inputs and actual host toolchain
        id: sdk-cache
        env:
          SOURCE_ID: ${{ hashFiles('native/godot-dotnet.lock', 'native/patches/**', 'native/build.sh', 'native/*.csproj', '.github/workflows/ci.yml', 'global.json', '**/Directory.*.props', '**/Directory.*.targets', '**/NuGet.Config', '**/nuget.config') }}
        run: |
          identity="$(
            set -e
            { printf '%s\n' "$SOURCE_ID" "${ImageOS:-}" "${ImageVersion:-}"; uname -sm; cat /etc/os-release;
              dotnet --info; clang --version; ld --version; ldd --version; python3 --version; git --version;
              if command -v dpkg-query >/dev/null; then dpkg-query -W;
              elif command -v pacman >/dev/null; then pacman -Q;
              elif command -v rpm >/dev/null; then rpm -qa | sort;
              else echo "Cannot fingerprint installed toolchain dependencies" >&2; exit 1; fi
              printf '%s\n' "${CFLAGS:-}" "${CXXFLAGS:-}" "${LDFLAGS:-}"; } | sha256sum
          )"
          identity="${identity%% *}"
          echo "key=ndom-sdk-v1-Linux-X64-$identity" >> "$GITHUB_OUTPUT"
          echo "work=$RUNNER_TOOL_CACHE/ndom-sdk-$identity" >> "$GITHUB_OUTPUT"
      - name: Cache pinned SDK dependencies only (never addon binaries)
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk-cache.outputs.work }}/sdk
          key: ${{ steps.sdk-cache.outputs.key }}
      - name: Build
        id: native-build
        env:
          NECRONOMIDOM_WORK: ${{ steps.sdk-cache.outputs.work }}
        run: native/build.sh linux-x64
      - name: Stage current portable managed SDK feed
        id: sdk-feed
        if: needs.changes.outputs.full == 'true'
        env:
          SDK_FEED: ${{ steps.native-build.outputs.sdk-feed }}
        run: |
          source native/godot-dotnet.lock
          feed="$SDK_FEED"
          test "$(cat "$feed/.identity")" = "$GODOT_DOTNET_COMMIT-$GODOT_DOTNET_PATCH_SHA256"
          stage="$(mktemp -d "$RUNNER_TEMP/sdk-feed.XXXXXX")"
          cp "$feed"/Godot.Bindings.*.nupkg "$feed"/Godot.SourceGeneration.*.nupkg "$feed/.identity" "$stage/"
          cp "$feed/godot-dotnet.lock" "$feed/$(basename "$GODOT_DOTNET_PATCH")" "$stage/"
          echo "path=$stage" >> "$GITHUB_OUTPUT"
      - name: Upload portable managed SDK feed
        uses: actions/upload-artifact@v4
        if: needs.changes.outputs.full == 'true'
        with:
          name: sdk-managed-feed
          path: ${{ steps.sdk-feed.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
      # Artifacts survive failed-job-only reruns; attempt-local handoffs do not.
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: addons/necronomidom/bin/
          if-no-files-found: error

  native-hosted:
    needs: [changes, native-linux-x64]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: NativeAOT Linux toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq clang zlib1g-dev
      - name: Receive portable managed SDK feed
        uses: actions/download-artifact@v4
        with:
          name: sdk-managed-feed
          path: ${{ runner.temp }}/sf
      - name: Build
        shell: bash
        env:
          NECRONOMIDOM_WORK: ${{ runner.temp }}/nd
          NECRONOMIDOM_SDK_FEED: ${{ runner.temp }}/sf
        run: native/build.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: addons/necronomidom/bin/
          if-no-files-found: error

  smoke:
    needs: [changes, native-linux-x64]
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","necronomidom"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: addons/necronomidom/bin/
      - name: Install Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          cd "$RUNNER_TEMP"
          curl -sSLO "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSLO "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -oq "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d godot
          unzip -oq "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" -d godot-mono
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "GODOT_MONO=$RUNNER_TEMP/godot-mono/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: GDScript demo in standard Godot
        run: |
          cp native/necronomidom.gdextension addons/necronomidom/
          "$GODOT" --headless --audio-driver Dummy --path . --import res://demo/gdscript/demo.tscn
          "$GODOT" --headless --path . res://demo/gdscript/demo.tscn -- --smoke
      - name: Native authoring tools and shared-resource lifetime
        run: '"$GODOT" --headless --path . res://demo/authoring/native-smoke.tscn'
      - name: Native retained paint classes
        run: '"$GODOT" --headless --path . res://demo/paint/native-smoke.tscn'
      - name: C# demo in .NET Godot
        run: |
          rm -rf .godot
          "$GODOT_MONO" --headless --audio-driver Dummy --path . --import
          dotnet build NecronomiDOM.Demo.csproj -nologo
          "$GODOT_MONO" --headless --path . -- --smoke
          "$GODOT_MONO" --headless --path . -- --workbench-smoke
      - name: C# inspector and state-preserving reload
        run: '"$GODOT_MONO" --headless --path . res://demo/authoring/smoke.tscn'
      - name: Typed binding state, input and document lifetime
        run: '"$GODOT_MONO" --headless --path . res://demo/bindings/smoke.tscn'
      - name: Retained paint updates and glyph target reuse
        run: '"$GODOT_MONO" --headless --path . res://demo/paint/smoke.tscn'
      - name: Retained paint without per-frame RenderingServer synchronization
        # Godot reports per-frame render-thread synchronization only while a separate render thread draws real
        # frames, so this run uses a virtual X display and Mesa's software OpenGL rather than --headless.
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri)
          xvfb-run -a -s "-screen 0 1440x1000x24" "$GODOT_MONO" --path . --rendering-method gl_compatibility \
            --render-thread separate --audio-driver Dummy res://demo/paint/smoke.tscn -- --require-render-sync-check
      - name: Opt-in document update timing file
        env:
          NECRONOMIDOM_UPDATE_TIMING: '1'
        run: '"$GODOT_MONO" --headless --path . res://demo/paint/timing-smoke.tscn'
      - name: Fused single-fill polygon clips in linear composition
        run: |
          "$GODOT_MONO" --headless --path . res://demo/paint/single-fill-smoke.tscn
          xvfb-run -a -s "-screen 0 1440x1000x24" "$GODOT_MONO" --path . --rendering-method gl_compatibility \
            --audio-driver Dummy res://demo/paint/single-fill-smoke.tscn

  package:
    needs: [changes, docs, test, native-linux-x64, native-hosted, smoke]
    # A skipped matrix is acceptable only for the explicitly requested manual diagnostic.
    if: ${{ !cancelled() && needs.changes.outputs.package == 'true' && needs.docs.result == 'success' && needs.test.result == 'success' && needs.native-linux-x64.result == 'success' && needs.smoke.result == 'success' && (needs.native-hosted.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.partial == true && needs.native-hosted.result == 'skipped')) }}
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","necronomidom"]') || 'ubuntu-24.04' }}
    outputs:
      name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: vars.LINUX_RUNNER != 'self-hosted'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: addons/necronomidom/bin/
          merge-multiple: true
      - name: Assemble addon
        id: zip
        env:
          PARTIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.partial == true }}
        run: |
          name="NecronomiDOM-${GITHUB_REF_NAME//\//-}"
          cp native/necronomidom.gdextension addons/necronomidom/
          for lib in linux-x64/libnecronomidom.so linux-arm64/libnecronomidom.so win-x64/necronomidom.dll \
                     osx-arm64/libnecronomidom.dylib osx-x64/libnecronomidom.dylib; do
            if [ ! -s "addons/necronomidom/bin/$lib" ]; then
              if [ "$PARTIAL" = "true" ]; then echo "partial: no $lib"; partial=1; else echo "missing $lib"; exit 1; fi
            fi
          done
          if [ "${partial:-}" = "1" ]; then
            python3 - <<'PY'
          import configparser
          from pathlib import Path

          descriptor = Path("addons/necronomidom/necronomidom.gdextension")
          config = configparser.ConfigParser(interpolation=None)
          config.optionxform = str
          config.read(descriptor, encoding="utf-8")
          for platform, library in list(config["libraries"].items()):
              path = Path(library.strip('"').removeprefix("res://"))
              if not path.is_file() or path.stat().st_size == 0:
                  config.remove_option("libraries", platform)
          if not config["libraries"]:
              raise SystemExit("Cannot package an addon without a native library")
          with descriptor.open("w", encoding="utf-8") as output:
              config.write(output)
          PY
          fi
          name="$name${partial:+-partial}.zip"
          rm -rf dist && mkdir -p dist
          python3 -c "import shutil; shutil.make_archive('dist/archive', 'zip', '.', 'addons/necronomidom')"
          mv dist/archive.zip "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Install official standard Godot for package qualification
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --silent --show-error "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$archive"
          unzip -oq "$archive" -d "$RUNNER_TEMP/godot-package"
          echo "GODOT_PACKAGE=$RUNNER_TEMP/godot-package/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Qualify freshly installed ZIP in stock Godot
        run: |
          python3 scripts/qualify-stock-package.py \
            --godot "$GODOT_PACKAGE" --godot-version "$GODOT_VERSION" \
            --package "dist/${{ steps.zip.outputs.name }}"
      - name: Keep ZIP locally
        if: vars.LINUX_RUNNER == 'self-hosted'
        run: |
          mkdir -p "$HOME/.cache/necronomidom-ci/dist"
          cp "dist/${{ steps.zip.outputs.name }}" "$HOME/.cache/necronomidom-ci/dist/"
          echo "ZIP: $HOME/.cache/necronomidom-ci/dist/${{ steps.zip.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload addon ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NecronomiDOM
          path: dist/${{ steps.zip.outputs.name }}
          if-no-files-found: error

  qualify-hosted:
    needs: [changes, package]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            archive: linux.arm64
            executable: Godot_vVERSION-stable_linux.arm64
          - os: windows-2025
            archive: win64.exe
            executable: Godot_vVERSION-stable_win64_console.exe
          - os: macos-15
            archive: macos.universal
            executable: Godot.app/Contents/MacOS/Godot
          - os: macos-15-intel
            archive: macos.universal
            executable: Godot.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: NecronomiDOM
          path: dist
      - name: Install official standard Godot
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl --fail --location --silent --show-error \
            "$base/Godot_v${GODOT_VERSION}-stable_${ARCHIVE}.zip" -o "$RUNNER_TEMP/godot.zip"
          python -m zipfile -e "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot-stock"
          binary="$RUNNER_TEMP/godot-stock/${EXECUTABLE//VERSION/$GODOT_VERSION}"
          chmod +x "$binary"
          echo "GODOT_PACKAGE=$binary" >> "$GITHUB_ENV"
      - name: Qualify final installed ZIP on target architecture
        shell: bash
        run: |
          python scripts/qualify-stock-package.py \
            --godot "$GODOT_PACKAGE" --godot-version "$GODOT_VERSION" \
            --package "dist/${{ needs.package.outputs.name }}"

  release:
    needs: [package, qualify-hosted]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && needs.qualify-hosted.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NecronomiDOM
          path: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ needs.package.outputs.name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
