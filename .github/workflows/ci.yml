name: CI/CD

# Every push and pull request: core tests, all five desktop NativeAOT targets, source smoke runs,
# then fresh-installed ZIP qualification on each target architecture before GitHub release.
# Tags named v*: publish the qualified ZIP as a GitHub release. Asset Store submission remains paused/manual.
#
# Repository variables choose where jobs run:
#   LINUX_RUNNER=self-hosted Linux x64 jobs run on a self-hosted Linux x64 runner;
#                             otherwise on GitHub-hosted ubuntu-24.04.
# Only an explicit workflow_dispatch partial=true skips hosted builds for a Linux-only diagnostic ZIP.
# On a self-hosted runner, jobs hand files to each other through ~/.cache/necronomidom-ci instead of GitHub artifact
# storage, and finished ZIPs are kept in ~/.cache/necronomidom-ci/dist.
# scripts/ci-local.sh runs this workflow locally with act (Linux x64 jobs only).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      partial:
        description: Linux-only diagnostic ZIP (never a release)
        type: boolean
        default: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","necronomidom"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        if: vars.LINUX_RUNNER != 'self-hosted'
        with:
          python-version: '3.12'
      - name: Check generated capability reference
        run: |
          python3 scripts/generate-capabilities.py --check
          python3 -m unittest discover -s scripts -p 'test_generate_capabilities.py'
      - run: dotnet test tests/NecronomiDom.Tests -nologo

  native-linux-x64:
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","necronomidom"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        if: vars.LINUX_RUNNER != 'self-hosted'
        with:
          python-version: '3.12'
      - name: NativeAOT toolchain
        run: command -v clang >/dev/null || (sudo apt-get update -q && sudo apt-get install -yq clang zlib1g-dev)
      - name: Build
        env:
          # Keep the built bindings between runs on a persistent runner (checkout cleans the workspace).
          NECRONOMIDOM_WORK: ${{ runner.tool_cache }}/necronomidom-native
        run: native/build.sh linux-x64
      - name: Hand off locally
        if: vars.LINUX_RUNNER == 'self-hosted'
        run: |
          handoff="$HOME/.cache/necronomidom-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$handoff/bin" && cp -r addons/necronomidom/bin/. "$handoff/bin/"
      - if: vars.LINUX_RUNNER != 'self-hosted'
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: addons/necronomidom/bin/
          if-no-files-found: error

  native-hosted:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.partial == true) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: NativeAOT Linux toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq clang zlib1g-dev
      - name: Build
        shell: bash
        env:
          NECRONOMIDOM_WORK: ${{ runner.temp }}/nd
        run: native/build.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: addons/necronomidom/bin/
          if-no-files-found: error

  smoke:
    needs: native-linux-x64
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","necronomidom"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Receive local binaries
        if: vars.LINUX_RUNNER == 'self-hosted'
        run: |
          mkdir -p addons/necronomidom/bin
          cp -r "$HOME/.cache/necronomidom-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/." addons/necronomidom/bin/
      - if: vars.LINUX_RUNNER != 'self-hosted'
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: addons/necronomidom/bin/
      - name: Install Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          cd "$RUNNER_TEMP"
          curl -sSLO "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSLO "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -oq "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d godot
          unzip -oq "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" -d godot-mono
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "GODOT_MONO=$RUNNER_TEMP/godot-mono/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: GDScript demo in standard Godot
        run: |
          cp native/necronomidom.gdextension addons/necronomidom/
          "$GODOT" --headless --audio-driver Dummy --path . --import res://demo/gdscript/demo.tscn
          "$GODOT" --headless --path . res://demo/gdscript/demo.tscn -- --smoke
      - name: Native authoring tools and shared-resource lifetime
        run: '"$GODOT" --headless --path . res://demo/authoring/native-smoke.tscn'
      - name: C# demo in .NET Godot
        run: |
          rm -rf .godot
          "$GODOT_MONO" --headless --audio-driver Dummy --path . --import
          dotnet build NecronomiDOM.Demo.csproj -nologo
          "$GODOT_MONO" --headless --path . -- --smoke
          "$GODOT_MONO" --headless --path . -- --workbench-smoke
      - name: C# inspector and state-preserving reload
        run: '"$GODOT_MONO" --headless --path . res://demo/authoring/smoke.tscn'
      - name: Typed binding state, input and document lifetime
        run: '"$GODOT_MONO" --headless --path . res://demo/bindings/smoke.tscn'

  package:
    needs: [test, native-linux-x64, native-hosted, smoke]
    # Hosted builds may be skipped only for an explicit manual diagnostic run, never a release.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.native-linux-x64.result == 'success' && needs.smoke.result == 'success' && (needs.native-hosted.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.partial == true && needs.native-hosted.result == 'skipped')) }}
    runs-on: ${{ vars.LINUX_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","necronomidom"]') || 'ubuntu-24.04' }}
    outputs:
      name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: vars.LINUX_RUNNER != 'self-hosted'
        with:
          python-version: '3.12'
      - name: Receive local binaries
        if: vars.LINUX_RUNNER == 'self-hosted'
        run: |
          mkdir -p addons/necronomidom/bin
          cp -r "$HOME/.cache/necronomidom-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin/." addons/necronomidom/bin/
      - uses: actions/download-artifact@v4
        if: vars.LINUX_RUNNER != 'self-hosted' || !(github.event_name == 'workflow_dispatch' && inputs.partial == true)
        with:
          pattern: native-*
          path: addons/necronomidom/bin/
          merge-multiple: true
      - name: Assemble addon
        id: zip
        env:
          PARTIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.partial == true }}
        run: |
          name="NecronomiDOM-${GITHUB_REF_NAME//\//-}"
          cp native/necronomidom.gdextension addons/necronomidom/
          for lib in linux-x64/libnecronomidom.so linux-arm64/libnecronomidom.so win-x64/necronomidom.dll \
                     osx-arm64/libnecronomidom.dylib osx-x64/libnecronomidom.dylib; do
            if [ ! -s "addons/necronomidom/bin/$lib" ]; then
              if [ "$PARTIAL" = "true" ]; then echo "partial: no $lib"; partial=1; else echo "missing $lib"; exit 1; fi
            fi
          done
          if [ "${partial:-}" = "1" ]; then
            python3 - <<'PY'
          import configparser
          from pathlib import Path

          descriptor = Path("addons/necronomidom/necronomidom.gdextension")
          config = configparser.ConfigParser(interpolation=None)
          config.optionxform = str
          config.read(descriptor, encoding="utf-8")
          for platform, library in list(config["libraries"].items()):
              path = Path(library.strip('"').removeprefix("res://"))
              if not path.is_file() or path.stat().st_size == 0:
                  config.remove_option("libraries", platform)
          if not config["libraries"]:
              raise SystemExit("Cannot package an addon without a native library")
          with descriptor.open("w", encoding="utf-8") as output:
              config.write(output)
          PY
          fi
          name="$name${partial:+-partial}.zip"
          rm -rf dist && mkdir -p dist
          python3 -c "import shutil; shutil.make_archive('dist/archive', 'zip', '.', 'addons/necronomidom')"
          mv dist/archive.zip "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Install official standard Godot for package qualification
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --silent --show-error "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$archive"
          unzip -oq "$archive" -d "$RUNNER_TEMP/godot-package"
          echo "GODOT_PACKAGE=$RUNNER_TEMP/godot-package/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Qualify freshly installed ZIP in stock Godot
        run: |
          python3 scripts/qualify-stock-package.py \
            --godot "$GODOT_PACKAGE" --godot-version "$GODOT_VERSION" \
            --package "dist/${{ steps.zip.outputs.name }}"
      - name: Keep ZIP locally
        if: vars.LINUX_RUNNER == 'self-hosted'
        run: |
          mkdir -p "$HOME/.cache/necronomidom-ci/dist"
          cp "dist/${{ steps.zip.outputs.name }}" "$HOME/.cache/necronomidom-ci/dist/"
          rm -rf "$HOME/.cache/necronomidom-ci/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "ZIP: $HOME/.cache/necronomidom-ci/dist/${{ steps.zip.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload addon ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NecronomiDOM
          path: dist/${{ steps.zip.outputs.name }}
          if-no-files-found: error

  qualify-hosted:
    needs: package
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.partial == true) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            archive: linux.arm64
            executable: Godot_vVERSION-stable_linux.arm64
          - os: windows-2025
            archive: win64.exe
            executable: Godot_vVERSION-stable_win64_console.exe
          - os: macos-15
            archive: macos.universal
            executable: Godot.app/Contents/MacOS/Godot
          - os: macos-15-intel
            archive: macos.universal
            executable: Godot.app/Contents/MacOS/Godot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: NecronomiDOM
          path: dist
      - name: Install official standard Godot
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl --fail --location --silent --show-error \
            "$base/Godot_v${GODOT_VERSION}-stable_${ARCHIVE}.zip" -o "$RUNNER_TEMP/godot.zip"
          python -m zipfile -e "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot-stock"
          binary="$RUNNER_TEMP/godot-stock/${EXECUTABLE//VERSION/$GODOT_VERSION}"
          chmod +x "$binary"
          echo "GODOT_PACKAGE=$binary" >> "$GITHUB_ENV"
      - name: Qualify final installed ZIP on target architecture
        shell: bash
        run: |
          python scripts/qualify-stock-package.py \
            --godot "$GODOT_PACKAGE" --godot-version "$GODOT_VERSION" \
            --package "dist/${{ needs.package.outputs.name }}"

  release:
    needs: [package, qualify-hosted]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && needs.qualify-hosted.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NecronomiDOM
          path: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ needs.package.outputs.name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
