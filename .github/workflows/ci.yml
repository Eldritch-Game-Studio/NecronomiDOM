name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      partial:
        description: Linux-only diagnostic ZIP (never a release)
        type: boolean
        default: false

# The called workflow reduces permissions to read except for its tag release job.
permissions:
  contents: write

jobs:
  local:
    uses: Eldritch-Game-Studio/NecronomiDOM/.github/workflows/ci-local.yml@main
    with:
      source-sha: ${{ github.sha }}
      partial: ${{ github.event_name == 'workflow_dispatch' && inputs.partial || false }}
