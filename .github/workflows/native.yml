name: Native libraries

# Builds the GDExtension library on every OS (NativeAOT compiles only for its host OS) and assembles the addon ZIP that
# works in both standard and .NET Godot. Tags named v* also publish the ZIP as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rids: linux-x64
          - os: ubuntu-24.04-arm
            rids: linux-arm64
          - os: windows-2025
            rids: win-x64
          - os: macos-15
            rids: osx-arm64 osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        shell: bash
        run: native/build.sh ${{ matrix.rids }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: addons/necronomidom/bin/
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: addons/necronomidom/bin/
          merge-multiple: true
      - name: Assemble addon
        run: |
          cp native/necronomidom.gdextension addons/necronomidom/
          mkdir -p dist
          zip -qr dist/NecronomiDOM.zip addons/necronomidom -x 'addons/necronomidom/core/bin/*' 'addons/necronomidom/core/obj/*'
          unzip -l dist/NecronomiDOM.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: NecronomiDOM
          path: dist/NecronomiDOM.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/NecronomiDOM.zip --title "$GITHUB_REF_NAME" --generate-notes
