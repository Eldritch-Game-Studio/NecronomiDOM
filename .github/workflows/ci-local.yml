name: Trusted local CI/CD

# Runner groups must allow only this reusable workflow at refs/heads/main.
# The event wrapper may be PR-controlled; admission below uses the immutable event,
# never caller-supplied trust flags. All jobs execute locally, including PRs.
on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact event commit (PR merge snapshot), checked before checkout
        type: string
        required: true
      partial:
        description: Linux-only diagnostic ZIP (never a release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  admit:
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    # Configure required reviewers BEFORE enabling LOCAL_EXTERNAL_PR_APPROVAL_ENABLED.
    # Even an absent environment/variable cannot admit fork code: the trusted script fails closed.
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'local-runner-external-pr' || 'local-runner-internal' }}
    steps:
      - name: Validate immutable source and runner admission
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          EXTERNAL_APPROVAL_ENABLED: ${{ vars.LOCAL_EXTERNAL_PR_APPROVAL_ENABLED }}
          WINDOWS_ENABLED: ${{ vars.NECRONOMIDOM_WINDOWS_ENABLED == 'true' }}
        run: |
          "$HOME/.local/share/eldritch-macos/tools/bin/python3" - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          if repository != "Eldritch-Game-Studio/NecronomiDOM":
              raise SystemExit("This workflow only qualifies NecronomiDOM events")
          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name not in {"push", "pull_request", "workflow_dispatch"}:
              raise SystemExit("Unsupported CI event")
          source = os.environ["SOURCE_SHA"]
          if not re.fullmatch("[0-9a-f]{40}", source) or source != os.environ["GITHUB_SHA"]:
              raise SystemExit("Source must be the exact immutable event commit")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if event_name == "pull_request":
              pr = event.get("pull_request", {})
              head = pr.get("head", {}).get("repo") or {}
              base = pr.get("base", {}).get("repo") or {}
              if base.get("full_name") != repository or not head.get("full_name"):
                  raise SystemExit("Invalid pull request repository identity")
              if head["full_name"] != repository and os.environ.get("EXTERNAL_APPROVAL_ENABLED") != "true":
                  raise SystemExit("External PRs require configured protected-environment approval; no fork code was checked out")
          print("Validated immutable source and local runner admission")
          if os.environ.get("WINDOWS_ENABLED") != "true":
              print("Windows is explicitly deferred and unqualified; no Windows jobs or five-target release publication.")
          PY

  changes:
    needs: admit
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      code: ${{ steps.policy.outputs.code }}
      full: ${{ steps.policy.outputs.full }}
      package: ${{ steps.policy.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Select installed Apple tools
        run: echo "$HOME/.local/share/eldritch-macos/tools/bin" >> "$GITHUB_PATH"
      - name: Classify event and complete changed paths
        id: policy
        run: python3 scripts/ci-policy.py

  docs:
    needs: changes
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Select installed Apple tools
        run: echo "$HOME/.local/share/eldritch-macos/tools/bin" >> "$GITHUB_PATH"
      - name: Check documentation content and offline link targets
        run: |
          python3 scripts/check-docs.py
          python3 scripts/generate-capabilities.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Select installed ARM64 SDK and Python
        run: |
          echo "$HOME/.local/share/eldritch-macos/tools/bin" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT_ARM64=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Check generated capability reference
        run: |
          python3 scripts/generate-capabilities.py --check
          python3 -m unittest discover -s scripts -p 'test_generate_capabilities.py'
      - run: python3 scripts/apple-locked.py /usr/bin/arch -arm64 dotnet test tests/NecronomiDom.Tests -nologo --disable-build-servers

  native-linux-x64:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Require provisioned .NET SDK
        run: dotnet --info
      - name: Require installed local native toolchain
        run: |
          command -v python
          command -v python3
          command -v clang
      - name: Identify pinned SDK inputs and actual host toolchain
        id: sdk-cache
        env:
          SOURCE_ID: ${{ hashFiles('native/godot-dotnet.lock', 'native/patches/**', 'native/build.sh', 'native/*.csproj', '.github/workflows/*.yml', 'global.json', '**/Directory.*.props', '**/Directory.*.targets', '**/NuGet.Config', '**/nuget.config') }}
        run: |
          identity="$(
            set -e
            { printf '%s\n' "$SOURCE_ID" "${ImageOS:-}" "${ImageVersion:-}"; uname -sm; cat /etc/os-release;
              dotnet --info; clang --version; ld --version; ldd --version; python3 --version; git --version;
              if command -v dpkg-query >/dev/null; then dpkg-query -W;
              elif command -v pacman >/dev/null; then pacman -Q;
              elif command -v rpm >/dev/null; then rpm -qa | sort;
              else echo "Cannot fingerprint installed toolchain dependencies" >&2; exit 1; fi
              printf '%s\n' "${CFLAGS:-}" "${CXXFLAGS:-}" "${LDFLAGS:-}"; } | sha256sum
          )"
          identity="${identity%% *}"
          echo "key=ndom-sdk-v1-Linux-X64-$identity" >> "$GITHUB_OUTPUT"
          echo "work=$RUNNER_TOOL_CACHE/ndom-sdk-$identity" >> "$GITHUB_OUTPUT"
      - name: Cache pinned SDK dependencies only (never addon binaries)
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk-cache.outputs.work }}/sdk
          key: ${{ steps.sdk-cache.outputs.key }}
      - name: Build
        id: native-build
        env:
          NECRONOMIDOM_WORK: ${{ steps.sdk-cache.outputs.work }}
        run: native/build.sh linux-x64
      - name: Stage current portable managed SDK feed
        id: sdk-feed
        if: needs.changes.outputs.full == 'true'
        env:
          SDK_FEED: ${{ steps.native-build.outputs.sdk-feed }}
        run: |
          source native/godot-dotnet.lock
          feed="$SDK_FEED"
          test "$(cat "$feed/.identity")" = "$GODOT_DOTNET_COMMIT-$GODOT_DOTNET_PATCH_SHA256"
          stage="$(mktemp -d "$RUNNER_TEMP/sdk-feed.XXXXXX")"
          cp "$feed"/Godot.Bindings.*.nupkg "$feed"/Godot.SourceGeneration.*.nupkg "$feed/.identity" "$stage/"
          cp "$feed/godot-dotnet.lock" "$feed/$(basename "$GODOT_DOTNET_PATCH")" "$stage/"
          echo "path=$stage" >> "$GITHUB_OUTPUT"
      - name: Upload portable managed SDK feed
        uses: actions/upload-artifact@v4
        if: needs.changes.outputs.full == 'true'
        with:
          name: sdk-managed-feed
          path: ${{ steps.sdk-feed.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
      # Artifacts survive failed-job-only reruns; attempt-local handoffs do not.
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: addons/necronomidom/bin/
          if-no-files-found: error

  native-platforms:
    needs: [changes, native-linux-x64]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows is explicitly deferred until an administrator enables a provisioned local runner.
        include: ${{ fromJSON(vars.NECRONOMIDOM_WINDOWS_ENABLED == 'true' && '[{"runner":["self-hosted","Linux","ARM64","eldritch-linux-arm64"],"rid":"linux-arm64"},{"runner":["self-hosted","Windows","X64","eldritch-windows"],"rid":"win-x64"}]' || '[{"runner":["self-hosted","Linux","ARM64","eldritch-linux-arm64"],"rid":"linux-arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Require provisioned .NET SDK
        run: dotnet --info
      - name: Require installed local native tools
        shell: bash
        run: |
          command -v python
          if [ "$RUNNER_OS" = Linux ]; then command -v clang; fi
      - name: Receive portable managed SDK feed
        uses: actions/download-artifact@v4
        with:
          name: sdk-managed-feed
          path: ${{ runner.temp }}/sf
      - name: Build
        shell: bash
        env:
          NECRONOMIDOM_WORK: ${{ runner.temp }}/nd
          NECRONOMIDOM_SDK_FEED: ${{ runner.temp }}/sf
        run: native/build.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: addons/necronomidom/bin/
          if-no-files-found: error

  native-apple:
    needs: [changes, native-linux-x64]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Select installed ARM64 SDK and Python
        run: |
          echo "$HOME/.local/share/eldritch-macos/tools/bin" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT_ARM64=$HOME/.dotnet" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: sdk-managed-feed
          path: ${{ runner.temp }}/necronomidom-feed
      - name: NativeAOT with ARM64 SDK and explicit target RID
        # macOS NativeAOT supports same-OS crossarchitecture compilation; x64 execution is separately proved under Rosetta.
        env:
          NECRONOMIDOM_WORK: ${{ runner.temp }}/necronomidom-${{ matrix.rid }}
          NECRONOMIDOM_SDK_FEED: ${{ runner.temp }}/necronomidom-feed
        run: |
          python3 scripts/apple-locked.py /usr/bin/arch -arm64 /bin/bash native/build.sh "${{ matrix.rid }}"
          arch=arm64
          if [ "${{ matrix.rid }}" = osx-x64 ]; then arch=x86_64; fi
          /usr/bin/lipo -verify_arch "$arch" "addons/necronomidom/bin/${{ matrix.rid }}/libnecronomidom.dylib"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: addons/necronomidom/bin/
          if-no-files-found: error

  smoke:
    needs: [changes, native-linux-x64]
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Require provisioned .NET SDK and runtime
        run: dotnet --info
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: addons/necronomidom/bin/
      - name: Install Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          cd "$RUNNER_TEMP"
          curl -sSLO "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSLO "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -oq "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d godot
          unzip -oq "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip" -d godot-mono
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          echo "GODOT_MONO=$RUNNER_TEMP/godot-mono/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: GDScript demo in standard Godot
        run: |
          cp native/necronomidom.gdextension addons/necronomidom/
          "$GODOT" --headless --audio-driver Dummy --path . --import res://demo/gdscript/demo.tscn
          "$GODOT" --headless --path . res://demo/gdscript/demo.tscn -- --smoke
      - name: Native authoring tools and shared-resource lifetime
        run: '"$GODOT" --headless --path . res://demo/authoring/native-smoke.tscn'
      - name: Native retained paint classes
        run: '"$GODOT" --headless --path . res://demo/paint/native-smoke.tscn'
      - name: C# demo in .NET Godot
        run: |
          rm -rf .godot
          "$GODOT_MONO" --headless --audio-driver Dummy --path . --import
          dotnet build NecronomiDOM.Demo.csproj -nologo
          "$GODOT_MONO" --headless --path . -- --smoke
          "$GODOT_MONO" --headless --path . -- --workbench-smoke
      - name: C# inspector and state-preserving reload
        run: '"$GODOT_MONO" --headless --path . res://demo/authoring/smoke.tscn'
      - name: Typed binding state, input and document lifetime
        run: '"$GODOT_MONO" --headless --path . res://demo/bindings/smoke.tscn'
      - name: Retained paint updates and glyph target reuse
        run: '"$GODOT_MONO" --headless --path . res://demo/paint/smoke.tscn'
      - name: Retained paint without per-frame RenderingServer synchronization
        # Godot reports per-frame render-thread synchronization only while a separate render thread draws real
        # frames, so this run uses a virtual X display and Mesa's software OpenGL rather than --headless.
        run: |
          command -v xvfb-run >/dev/null || { echo "Install Xvfb and Mesa on the local Linux runner" >&2; exit 1; }
          xvfb-run -a -s "-screen 0 1440x1000x24" "$GODOT_MONO" --path . --rendering-method gl_compatibility \
            --render-thread separate --audio-driver Dummy res://demo/paint/smoke.tscn -- --require-render-sync-check
      - name: Opt-in document update timing file
        env:
          NECRONOMIDOM_UPDATE_TIMING: '1'
        run: '"$GODOT_MONO" --headless --path . res://demo/paint/timing-smoke.tscn'
      - name: Fused single-fill polygon clips in linear composition
        run: |
          "$GODOT_MONO" --headless --path . res://demo/paint/single-fill-smoke.tscn
          xvfb-run -a -s "-screen 0 1440x1000x24" "$GODOT_MONO" --path . --rendering-method gl_compatibility \
            --audio-driver Dummy res://demo/paint/single-fill-smoke.tscn

  package:
    needs: [changes, docs, test, native-linux-x64, native-platforms, native-apple, smoke]
    # Skipped target matrices are acceptable only for the explicitly requested manual Linux diagnostic.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.package == 'true' && needs.docs.result == 'success' && needs.test.result == 'success' && needs.native-linux-x64.result == 'success' && needs.smoke.result == 'success' && ((needs.native-platforms.result == 'success' && needs.native-apple.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.partial == true && needs.native-platforms.result == 'skipped' && needs.native-apple.result == 'skipped')) }}
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    outputs:
      name: ${{ steps.zip.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Select installed Apple tools
        run: echo "$HOME/.local/share/eldritch-macos/tools/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: addons/necronomidom/bin/
          merge-multiple: true
      - name: Assemble addon
        id: zip
        env:
          PARTIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.partial == true }}
          WINDOWS_ENABLED: ${{ vars.NECRONOMIDOM_WINDOWS_ENABLED == 'true' }}
        run: python3 scripts/assemble-package.py
      - name: Upload addon ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NecronomiDOM
          path: dist/${{ steps.zip.outputs.name }}
          if-no-files-found: error

  qualify-linux-x64:
    needs: package
    runs-on: [self-hosted, Linux, X64, eldritch-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Require installed local Python
        run: command -v python3
      - uses: actions/download-artifact@v4
        with:
          name: NecronomiDOM
          path: dist
      - name: Install official standard Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          archive="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --silent --show-error "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$archive"
          unzip -oq "$archive" -d "$RUNNER_TEMP/godot-package"
          echo "GODOT_PACKAGE=$RUNNER_TEMP/godot-package/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Qualify final installed ZIP on Linux x64
        run: |
          python3 scripts/qualify-stock-package.py \
            --godot "$GODOT_PACKAGE" --godot-version "$GODOT_VERSION" \
            --package "dist/${{ needs.package.outputs.name }}"

  qualify-platforms:
    needs: [changes, package]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.NECRONOMIDOM_WINDOWS_ENABLED == 'true' && '[{"runner":["self-hosted","Linux","ARM64","eldritch-linux-arm64"],"archive":"linux.arm64","executable":"Godot_vVERSION-stable_linux.arm64"},{"runner":["self-hosted","Windows","X64","eldritch-windows"],"archive":"win64.exe","executable":"Godot_vVERSION-stable_win64_console.exe"}]' || '[{"runner":["self-hosted","Linux","ARM64","eldritch-linux-arm64"],"archive":"linux.arm64","executable":"Godot_vVERSION-stable_linux.arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Require installed local Python
        shell: bash
        run: command -v python
      - uses: actions/download-artifact@v4
        with:
          name: NecronomiDOM
          path: dist
      - name: Install official standard Godot
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl --fail --location --silent --show-error \
            "$base/Godot_v${GODOT_VERSION}-stable_${ARCHIVE}.zip" -o "$RUNNER_TEMP/godot.zip"
          python -m zipfile -e "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot-stock"
          binary="$RUNNER_TEMP/godot-stock/${EXECUTABLE//VERSION/$GODOT_VERSION}"
          chmod +x "$binary"
          echo "GODOT_PACKAGE=$binary" >> "$GITHUB_ENV"
      - name: Qualify final installed ZIP on target architecture
        shell: bash
        run: |
          python scripts/qualify-stock-package.py \
            --godot "$GODOT_PACKAGE" --godot-version "$GODOT_VERSION" \
            --package "dist/${{ needs.package.outputs.name }}"

  qualify-apple:
    needs: [changes, package]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Select installed Apple tools
        run: echo "$HOME/.local/share/eldritch-macos/tools/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: NecronomiDOM
          path: dist
      - name: Install official universal standard Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl --fail --location --silent --show-error \
            "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          /usr/bin/ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot-stock"
          binary="$RUNNER_TEMP/godot-stock/Godot.app/Contents/MacOS/Godot"
          chmod +x "$binary"
          /usr/bin/lipo -verify_arch "${{ matrix.architecture }}" "$binary"
          echo "GODOT_PACKAGE=$binary" >> "$GITHUB_ENV"
      - name: Qualify exact final ZIP with architecture-bound stock Godot
        run: |
          python3 scripts/apple-locked.py python3 scripts/qualify-stock-package.py \
            --godot "$GODOT_PACKAGE" --godot-version "$GODOT_VERSION" \
            --architecture "${{ matrix.architecture }}" \
            --package "dist/${{ needs.package.outputs.name }}"

  release:
    needs: [package, qualify-linux-x64, qualify-platforms, qualify-apple]
    if: ${{ vars.NECRONOMIDOM_WINDOWS_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && needs.qualify-linux-x64.result == 'success' && needs.qualify-platforms.result == 'success' && needs.qualify-apple.result == 'success' }}
    runs-on: [self-hosted, macOS, ARM64, eldritch-apple]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NecronomiDOM
          path: dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ needs.package.outputs.name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
