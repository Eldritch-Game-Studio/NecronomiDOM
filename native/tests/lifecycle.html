<!doctype html>
<html>
<head>
    <style>
        html, body, p, button { display: block; box-sizing: border-box; margin: 0; font-family: "Noto Sans"; font-size: 18px; line-height: 26px; font-weight: normal; }
        body { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; color: #d6e6df; background: #13271f; font-family: "Noto Sans"; font-size: 18px; }
        #title { font-size: 36px; line-height: 48px; color: rgb(150, 220, 170); }
        button { appearance: none; padding: 8px 16px; border: 1px solid #7ab89b; background: #234c3a; color: #ffffff; }
    </style>
</head>
<body>
    <p id="title">Native lifetime</p>
    <p>Real font shaping and retained paint survive each reload.</p>
    <button id="action">Activate</button>
    <p id="result">Ready</p>
</body>
</html>
